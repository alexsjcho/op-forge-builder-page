    // document mints the blobs for its OWN frames, obtaining page text

    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(\"ea527dbd-0ee4-4d60-89ac-751da0c1f124\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* Colour system.\n   The six named brand colours come from the SoftwareForge Design System v1 PDF.\n   That PDF states its hexes are INFERRED from brand tone, not pulled from live CSS.\n   Everything marked \"derived\" below was generated in oklch to stay harmonious with\n   those six anchors — it is not sourced from the brand. Verify before production. */\n:root {\n  /* --- Brand anchors (from PDF) --- */\n  --forge-ink-black: #0B0D10;    /* primary background */\n  --forge-steel: #1A1F26;        /* cards / panels */\n  --forge-slate-gray: #8A93A0;   /* secondary text */\n  --forge-off-white: #F4F5F6;    /* text on dark */\n  --forge-ember: #FF5A1F;        /* primary accent */\n  --forge-signal-blue: #3D7EFF;  /* secondary accent */\n\n  /* --- Neutral ramp (derived, oklch-stepped between Ink Black and Off White) --- */\n  --neutral-1000: #0B0D10;\n  --neutral-900: #12161B;\n  --neutral-800: #1A1F26;\n  --neutral-700: #242A33;\n  --neutral-600: #333B46;\n  --neutral-500: #4B5462;\n  --neutral-400: #6B7480;\n  --neutral-300: #8A93A0;\n  --neutral-200: #B4BBC4;\n  --neutral-100: #D9DDE2;\n  --neutral-050: #F4F5F6;\n\n  /* --- Accent ramps (derived) --- */\n  --ember-600: #C63C0C;\n  --ember-500: #FF5A1F;\n  --ember-400: #FF7A47;\n  --ember-300: #FFA07B;\n  --ember-tint-12: rgba(255, 90, 31, 0.12);\n  --ember-tint-24: rgba(255, 90, 31, 0.24);\n\n  --blue-600: #2A5FD4;\n  --blue-500: #3D7EFF;\n  --blue-400: #6B9DFF;\n  --blue-tint-12: rgba(61, 126, 255, 0.12);\n  --blue-tint-24: rgba(61, 126, 255, 0.24);\n\n  /* --- Semantic status (derived; the site shows pass/wait states in the pipeline UI) --- */\n  --status-pass: #3FBF7F;\n  --status-pass-tint: rgba(63, 191, 127, 0.14);\n  --status-wait: #E0A93B;\n  --status-wait-tint: rgba(224, 169, 59, 0.14);\n  --status-risk: #E5484D;\n  --status-risk-tint: rgba(229, 72, 77, 0.14);\n  --status-info: var(--blue-500);\n  --status-info-tint: var(--blue-tint-12);\n\n  /* --- Semantic aliases: surfaces --- */\n  --surface-page: var(--forge-ink-black);\n  --surface-raised: var(--neutral-900);\n  --surface-card: var(--forge-steel);\n  --surface-card-hover: var(--neutral-700);\n  --surface-inset: #0E1216;\n  --surface-overlay: rgba(11, 13, 16, 0.82);\n  --surface-glass: rgba(26, 31, 38, 0.62);\n\n  /* --- Semantic aliases: text --- */\n  --text-strong: #FFFFFF;\n  --text-body: var(--forge-off-white);\n  --text-muted: var(--forge-slate-gray);\n  --text-faint: var(--neutral-400);\n  --text-accent: var(--forge-ember);\n  --text-on-accent: #FFFFFF;\n  --text-link: var(--forge-ember);\n  --text-link-hover: var(--ember-300);\n\n  /* --- Semantic aliases: borders --- */\n  --border-subtle: rgba(244, 245, 246, 0.08);\n  --border-default: rgba(244, 245, 246, 0.14);\n  --border-strong: rgba(244, 245, 246, 0.24);\n  --border-accent: var(--ember-tint-24);\n  --border-focus: var(--forge-signal-blue);\n}\n<\u002Fstyle>\n<style>/* Typography. Scale from the Design System v1 PDF \"Type scale (suggested)\" table;\n   ranges in that table are resolved to a single value here, with the upper bound\n   available as the -lg variant where the PDF gave a range. */\n:root {\n  --font-display: \"Space Grotesk\", \"General Sans\", \"Neue Montreal\", system-ui, sans-serif;\n  --font-body: \"Space Grotesk\", \"General Sans\", \"Neue Montreal\", system-ui, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Sizes */\n  --size-h1: 56px;\n  --size-h1-lg: 64px;\n  --size-h2: 36px;\n  --size-h2-lg: 40px;\n  --size-h3: 24px;\n  --size-h3-lg: 28px;\n  --size-body-lg: 18px;\n  --size-body: 16px;\n  --size-small: 14px;\n  --size-label: 13px;\n  --size-caption: 12px;\n\n  /* Stat numerals — the site renders bare figures (66%, 83%, Zero, 84, 90%) very large */\n  --size-stat: 72px;\n  --size-stat-sm: 48px;\n\n  /* Line heights */\n  --leading-tight: 1.05;\n  --leading-snug: 1.2;\n  --leading-normal: 1.4;\n  --leading-body: 1.55;   /* PDF: \"around 1.5-1.6 since feature descriptions run long\" */\n  --leading-loose: 1.65;\n\n  /* Tracking */\n  --tracking-tight: -0.03em;   /* H1, per PDF \"tight tracking\" */\n  --tracking-snug: -0.015em;   /* H2 / H3 */\n  --tracking-normal: 0em;\n  --tracking-wide: 0.08em;\n  --tracking-eyebrow: 0.14em;  /* uppercase eyebrows: AI-NATIVE SDLC PLATFORM, GOVERNANCE */\n\n  /* Semantic type roles */\n  --type-h1-font: var(--weight-bold) var(--size-h1) / var(--leading-tight) var(--font-display);\n  --type-h2-font: var(--weight-semibold) var(--size-h2) / var(--leading-snug) var(--font-display);\n  --type-h3-font: var(--weight-semibold) var(--size-h3) / var(--leading-snug) var(--font-display);\n  --type-body-font: var(--weight-regular) var(--size-body-lg) / var(--leading-body) var(--font-body);\n  --type-label-font: var(--weight-medium) var(--size-label) / var(--leading-normal) var(--font-mono);\n  --type-stat-font: var(--weight-bold) var(--size-stat) / var(--leading-tight) var(--font-display);\n}\n<\u002Fstyle>\n<style>/* Spacing. 4px base unit; section rhythm is generous — the marketing pages run\n   long full-width sections separated by ~120-160px of vertical air. */\n:root {\n  --space-0: 0px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-30: 120px;\n  --space-40: 160px;\n\n  /* Semantic */\n  --gap-inline: var(--space-3);       /* button icon → label, chip rows */\n  --gap-stack-tight: var(--space-3);  /* eyebrow → headline */\n  --gap-stack: var(--space-6);        /* headline → paragraph */\n  --gap-card: var(--space-8);         /* grid gutters between cards */\n  --pad-card: var(--space-8);\n  --pad-card-lg: var(--space-10);\n  --pad-section-y: var(--space-30);\n  --pad-page-x: var(--space-8);\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 720px;   /* paragraph measure under a headline */\n  --container-wide: 1440px;\n  --header-height: 72px;\n}\n<\u002Fstyle>\n<style>/* Corner radii. Restrained — this is an enterprise-technical surface, not a\n   consumer app. Buttons and chips are soft rectangles, not pills; the only true\n   pills are small status/eyebrow chips. */\n:root {\n  --radius-0: 0px;\n  --radius-xs: 4px;    /* inline code, tiny tags */\n  --radius-sm: 6px;    /* inputs, small chips */\n  --radius-md: 8px;    /* buttons */\n  --radius-lg: 12px;   /* cards, panels */\n  --radius-xl: 16px;   /* large feature panels, screenshot frames */\n  --radius-2xl: 24px;  /* full-bleed media containers */\n  --radius-pill: 999px;\n\n  --border-width-hairline: 1px;\n  --border-width-thick: 2px;\n}\n<\u002Fstyle>\n<style>/* Elevation. On a near-black page, depth reads through BORDER + subtle inner\n   highlight far more than through drop shadow. Shadows here are used sparingly:\n   only lifted overlays and the ember glow on primary actions. */\n:root {\n  /* Outer shadows */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);\n  --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.55);\n  --shadow-overlay: 0 32px 80px rgba(0, 0, 0, 0.65);\n\n  /* Accent glow — primary CTA and active pipeline stage */\n  --glow-ember: 0 0 0 1px var(--ember-tint-24), 0 8px 32px rgba(255, 90, 31, 0.28);\n  --glow-blue: 0 0 0 1px var(--blue-tint-24), 0 8px 32px rgba(61, 126, 255, 0.24);\n\n  /* Inner highlight — the 1px top-edge light that makes a Steel card read as raised */\n  --inner-top-highlight: inset 0 1px 0 rgba(244, 245, 246, 0.06); /* @kind other */\n  --inner-hairline: inset 0 0 0 1px var(--border-subtle); /* @kind other */\n\n  /* Composite card treatments */\n  --elev-card: var(--inner-top-highlight), var(--shadow-sm);\n  --elev-card-hover: var(--inner-top-highlight), var(--shadow-md);\n  --elev-panel: var(--inner-top-highlight), var(--shadow-md);\n\n  /* Protection gradients — used over screenshots/video so text stays legible,\n     and to fade long scrolling rails out at the edges */\n  --scrim-bottom: linear-gradient(to top, var(--forge-ink-black) 0%, rgba(11, 13, 16, 0.7) 40%, transparent 100%); /* @kind other */\n  --scrim-top: linear-gradient(to bottom, var(--forge-ink-black) 0%, transparent 100%); /* @kind other */\n  --fade-x: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%); /* @kind other */\n\n  /* Blur — only on the sticky header and modal scrims */\n  --blur-header: saturate(140%) blur(16px); /* @kind other */\n  --blur-overlay: blur(24px); /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Motion. Restrained and quick. No bounce, no spring overshoot — the brand\n   promise is control. Fades and short vertical rises only. */\n:root {\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-linear: linear; /* @kind other */\n\n  --dur-instant: 80ms; /* @kind other */\n  --dur-fast: 140ms; /* @kind other */    /* hover / press feedback */\n  --dur-base: 220ms; /* @kind other */    /* accordion, tab switch */\n  --dur-slow: 400ms; /* @kind other */    /* section reveal on scroll */\n  --dur-marquee: 32s; /* @kind other */   /* logo cloud loop */\n\n  --transition-hover: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); /* @kind other */\n  --transition-transform: transform var(--dur-fast) var(--ease-out); /* @kind other */\n\n  --reveal-rise: 16px;   /* how far a section rises as it fades in */\n  --press-scale: 0.985; /* @kind other */  /* press state: barely-there shrink, no colour flash */\n}\n<\u002Fstyle>\n<style>/* Minimal element defaults so a bare page picks up the brand immediately.\n   Component styling lives in the components themselves. */\n*, *::before, *::after { box-sizing: border-box }\nhtml { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale }\nbody { margin: 0; background: var(--surface-page); color: var(--text-body); font: var(--type-body-font); text-wrap: pretty }\nh1, h2, h3, h4 { margin: 0; color: var(--text-strong); text-wrap: balance }\nh1 { font: var(--type-h1-font); letter-spacing: var(--tracking-tight) }\nh2 { font: var(--type-h2-font); letter-spacing: var(--tracking-snug) }\nh3 { font: var(--type-h3-font); letter-spacing: var(--tracking-snug) }\np { margin: 0 }\na { color: var(--text-link); text-decoration: none; transition: var(--transition-hover) }\na:hover { color: var(--text-link-hover) }\ncode, kbd, pre, samp { font-family: var(--font-mono); font-size: 0.925em }\n::selection { background: var(--ember-tint-24); color: var(--text-strong) }\n:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px }\nimg, svg, video { display: block; max-width: 100% }\nhr { border: 0; border-top: 1px solid var(--border-subtle); margin: 0 }\n<\u002Fstyle>\n<style>/* SoftwareForge webfonts.\n   SUBSTITUTION: the live site is a Framer build whose real font binaries are not\n   publicly fetchable. The design-system PDF specifies \"a geometric or grotesque sans\n   with weight, like Inter, General Sans, or Neue Montreal at 600-700\" plus \"a\n   monospace for stats and metadata\". Nearest freely-licensed matches used here:\n     Display + Body : Space Grotesk  (grotesque, technical, tight-tracking at weight)\n     Utility / Mono : JetBrains Mono (engineering-tool mono, matches the product voice)\n   Loaded from the Google Fonts CDN rather than local binaries. Swap in the real\n   licensed faces (and local .woff2 files) when available. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d375ebf6-a406-4033-8899-ba086c3f8386\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1f7ef316-2412-4e51-b3e5-e04389ca167f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"21162954-997d-4cc5-99ba-af74a85f1ad2\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3c585091-827e-4d7e-b032-a6e86fdac282\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4618b150-746e-4ed0-965c-31a7ef264d91\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-f 7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ae6b8fa5-d4e6-4009-9a6b-3a9f194d51c4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(\"42e69b34-3952-425f-ab29-9f02614fbdb8\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(\"a1fa98cf-3812-4367-8da9-8abe5cc0c5aa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(\"ea527dbd-0ee4-4d60-89ac-751da0c1f124\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Colour system.\n   The six named brand colours come from the SoftwareForge Design System v1 PDF.\n   That PDF states its hexes are INFERRED from brand tone, not pulled from live CSS.\n   Everything marked \"derived\" below was generated in oklch to stay harmonious with\n   those six anchors — it is not sourced from the brand. Verify before production. */\n:root {\n  /* --- Brand anchors (from PDF) --- */\n  --forge-ink-black: #0B0D10;    /* primary background */\n  --forge-steel: #1A1F26;        /* cards / panels */\n  --forge-slate-gray: #8A93A0;   /* secondary text */\n  --forge-off-white: #F4F5F6;    /* text on dark */\n  --forge-ember: #FF5A1F;        /* primary accent */\n  --forge-signal-blue: #3D7EFF;  /* secondary accent */\n\n  /* --- Neutral ramp (derived, oklch-stepped between Ink Black and Off White) --- */\n  --neutral-1000: #0B0D10;\n  --neutral-900: #12161B;\n  --neutral-800: #1A1F26;\n  --neutral-700: #242A33;\n  --neutral-600: #333B46;\n  --neutral-500: #4B5462;\n  --neutral-400: #6B7480;\n  --neutral-300: #8A93A0;\n  --neutral-200: #B4BBC4;\n  --neutral-100: #D9DDE2;\n  --neutral-050: #F4F5F6;\n\n  /* --- Accent ramps (derived) --- */\n  --ember-600: #C63C0C;\n  --ember-500: #FF5A1F;\n  --ember-400: #FF7A47;\n  --ember-300: #FFA07B;\n  --ember-tint-12: rgba(255, 90, 31, 0.12);\n  --ember-tint-24: rgba(255, 90, 31, 0.24);\n\n  --blue-600: #2A5FD4;\n  --blue-500: #3D7EFF;\n  --blue-400: #6B9DFF;\n  --blue-tint-12: rgba(61, 126, 255, 0.12);\n  --blue-tint-24: rgba(61, 126, 255, 0.24);\n\n  /* --- Semantic status (derived; the site shows pass/wait states in the pipeline UI) --- */\n  --status-pass: #3FBF7F;\n  --status-pass-tint: rgba(63, 191, 127, 0.14);\n  --status-wait: #E0A93B;\n  --status-wait-tint: rgba(224, 169, 59, 0.14);\n  --status-risk: #E5484D;\n  --status-risk-tint: rgba(229, 72, 77, 0.14);\n  --status-info: var(--blue-500);\n  --status-info-tint: var(--blue-tint-12);\n\n  /* --- Semantic aliases: surfaces --- */\n  --surface-page: var(--forge-ink-black);\n  --surface-raised: var(--neutral-900);\n  --surface-card: var(--forge-steel);\n  --surface-card-hover: var(--neutral-700);\n  --surface-inset: #0E1216;\n  --surface-overlay: rgba(11, 13, 16, 0.82);\n  --surface-glass: rgba(26, 31, 38, 0.62);\n\n  /* --- Semantic aliases: text --- */\n  --text-strong: #FFFFFF;\n  --text-body: var(--forge-off-white);\n  --text-muted: var(--forge-slate-gray);\n  --text-faint: var(--neutral-400);\n  --text-accent: var(--forge-ember);\n  --text-on-accent: #FFFFFF;\n  --text-link: var(--forge-ember);\n  --text-link-hover: var(--ember-300);\n\n  /* --- Semantic aliases: borders --- */\n  --border-subtle: rgba(244, 245, 246, 0.08);\n  --border-default: rgba(244, 245, 246, 0.14);\n  --border-strong: rgba(244, 245, 246, 0.24);\n  --border-accent: var(--ember-tint-24);\n  --border-focus: var(--forge-signal-blue);\n}\n\n/* Typography. Scale from the Design System v1 PDF \"Type scale (suggested)\" table;\n   ranges in that table are resolved to a single value here, with the upper bound\n   available as the -lg variant where the PDF gave a range. */\n:root {\n  --font-display: \"Space Grotesk\", \"General Sans\", \"Neue Montreal\", system-ui, sans-serif;\n  --font-body: \"Space Grotesk\", \"General Sans\", \"Neue Montreal\", system-ui, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Sizes */\n  --size-h1: 56px;\n  --size-h1-lg: 64px;\n  --size-h2: 36px;\n  --size-h2-lg: 40px;\n  --size-h3: 24px;\n  --size-h3-lg: 28px;\n  --size-body-lg: 18px;\n  --size-body: 16px;\n  --size-small: 14px;\n  --size-label: 13px;\n  --size-caption: 12px;\n\n  /* Stat numerals — the site renders bare figures (66%, 83%, Zero, 84, 90%) very large */\n  --size-stat: 72px;\n  --size-stat-sm: 48px;\n\n  /* Line heights */\n  --leading-tight: 1.05;\n  --leading-snug: 1.2;\n  --leading-normal: 1.4;\n  --leading-body: 1.55;   /* PDF: \"around 1.5-1.6 since feature descriptions run long\" */\n  --leading-loose: 1.65;\n\n  /* Tracking */\n  --tracking-tight: -0.03em;   /* H1, per PDF \"tight tracking\" */\n  --tracking-snug: -0.015em;   /* H2 / H3 */\n  --tracking-normal: 0em;\n  --tracking-wide: 0.08em;\n  --tracking-eyebrow: 0.14em;  /* uppercase eyebrows: AI-NATIVE SDLC PLATFORM, GOVERNANCE */\n\n  /* Semantic type roles */\n  --type-h1-font: var(--weight-bold) var(--size-h1) / var(--leading-tight) var(--font-display);\n  --type-h2-font: var(--weight-semibold) var(--size-h2) / var(--leading-snug) var(--font-display);\n  --type-h3-font: var(--weight-semibold) var(--size-h3) / var(--leading-snug) var(--font-display);\n  --type-body-font: var(--weight-regular) var(--size-body-lg) / var(--leading-body) var(--font-body);\n  --type-label-font: var(--weight-medium) var(--size-label) / var(--leading-normal) var(--font-mono);\n  --type-stat-font: var(--weight-bold) var(--size-stat) / var(--leading-tight) var(--font-display);\n}\n\n/* Spacing. 4px base unit; section rhythm is generous — the marketing pages run\n   long full-width sections separated by ~120-160px of vertical air. */\n:root {\n  --space-0: 0px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-30: 120px;\n  --space-40: 160px;\n\n  /* Semantic */\n  --gap-inline: var(--space-3);       /* button icon → label, chip rows */\n  --gap-stack-tight: var(--space-3);  /* eyebrow → headline */\n  --gap-stack: var(--space-6);        /* headline → paragraph */\n  --gap-card: var(--space-8);         /* grid gutters between cards */\n  --pad-card: var(--space-8);\n  --pad-card-lg: var(--space-10);\n  --pad-section-y: var(--space-30);\n  --pad-page-x: var(--space-8);\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 720px;   /* paragraph measure under a headline */\n  --container-wide: 1440px;\n  --header-height: 72px;\n}\n\n/* Corner radii. Restrained — this is an enterprise-technical surface, not a\n   consumer app. Buttons and chips are soft rectangles, not pills; the only true\n   pills are small status/eyebrow chips. */\n:root {\n  --radius-0: 0px;\n  --radius-xs: 4px;    /* inline code, tiny tags */\n  --radius-sm: 6px;    /* inputs, small chips */\n  --radius-md: 8px;    /* buttons */\n  --radius-lg: 12px;   /* cards, panels */\n  --radius-xl: 16px;   /* large feature panels, screenshot frames */\n  --radius-2xl: 24px;  /* full-bleed media containers */\n  --radius-pill: 999px;\n\n  --border-width-hairline: 1px;\n  --border-width-thick: 2px;\n}\n\n/* Elevation. On a near-black page, depth reads through BORDER + subtle inner\n   highlight far more than through drop shadow. Shadows here are used sparingly:\n   only lifted overlays and the ember glow on primary actions. */\n:root {\n  /* Outer shadows */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);\n  --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.55);\n  --shadow-overlay: 0 32px 80px rgba(0, 0, 0, 0.65);\n\n  /* Accent glow — primary CTA and active pipeline stage */\n  --glow-ember: 0 0 0 1px var(--ember-tint-24), 0 8px 32px rgba(255, 90, 31, 0.28);\n  --glow-blue: 0 0 0 1px var(--blue-tint-24), 0 8px 32px rgba(61, 126, 255, 0.24);\n\n  /* Inner highlight — the 1px top-edge light that makes a Steel card read as raised */\n  --inner-top-highlight: inset 0 1px 0 rgba(244, 245, 246, 0.06); /* @kind other */\n  --inner-hairline: inset 0 0 0 1px var(--border-subtle); /* @kind other */\n\n  /* Composite card treatments */\n  --elev-card: var(--inner-top-highlight), var(--shadow-sm);\n  --elev-card-hover: var(--inner-top-highlight), var(--shadow-md);\n  --elev-panel: var(--inner-top-highlight), var(--shadow-md);\n\n  /* Protection gradients — used over screenshots/video so text stays legible,\n     and to fade long scrolling rails out at the edges */\n  --scrim-bottom: linear-gradient(to top, var(--forge-ink-black) 0%, rgba(11, 13, 16, 0.7) 40%, transparent 100%); /* @kind other */\n  --scrim-top: linear-gradient(to bottom, var(--forge-ink-black) 0%, transparent 100%); /* @kind other */\n  --fade-x: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%); /* @kind other */\n\n  /* Blur — only on the sticky header and modal scrims */\n  --blur-header: saturate(140%) blur(16px); /* @kind other */\n  --blur-overlay: blur(24px); /* @kind other */\n}\n\n/* Motion. Restrained and quick. No bounce, no spring overshoot — the brand\n   promise is control. Fades and short vertical rises only. */\n:root {\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-linear: linear; /* @kind other */\n\n  --dur-instant: 80ms; /* @kind other */\n  --dur-fast: 140ms; /* @kind other */    /* hover / press feedback */\n  --dur-base: 220ms; /* @kind other */    /* accordion, tab switch */\n  --dur-slow: 400ms; /* @kind other */    /* section reveal on scroll */\n  --dur-marquee: 32s; /* @kind other */   /* logo cloud loop */\n\n  --transition-hover: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); /* @kind other */\n  --transition-transform: transform var(--dur-fast) var(--ease-out); /* @kind other */\n\n  --reveal-rise: 16px;   /* how far a section rises as it fades in */\n  --press-scale: 0.985; /* @kind other */  /* press state: barely-there shrink, no colour flash */\n}\n\n/* Minimal element defaults so a bare page picks up the brand immediately.\n   Component styling lives in the components themselves. */\n*, *::before, *::after { box-sizing: border-box }\nhtml { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale }\nbody { margin: 0; background: var(--surface-page); color: var(--text-body); font: var(--type-body-font); text-wrap: pretty }\nh1, h2, h3, h4 { margin: 0; color: var(--text-strong); text-wrap: balance }\nh1 { font: var(--type-h1-font); letter-spacing: var(--tracking-tight) }\nh2 { font: var(--type-h2-font); letter-spacing: var(--tracking-snug) }\nh3 { font: var(--type-h3-font); letter-spacing: var(--tracking-snug) }\np { margin: 0 }\na { color: var(--text-link); text-decoration: none; transition: var(--transition-hover) }\na:hover { color: var(--text-link-hover) }\ncode, kbd, pre, samp { font-family: var(--font-mono); font-size: 0.925em }\n::selection { background: var(--ember-tint-24); color: var(--text-strong) }\n:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px }\nimg, svg, video { display: block; max-width: 100% }\nhr { border: 0; border-top: 1px solid var(--border-subtle); margin: 0 }\n\n<\u002Fstyle>\n<script src=\"7a476f83-5755-45af-8444-fcd61e819922\"><\u002Fscript>\n<script src=\"426ba9b0-7cc4-416d-9127-1e690ae457bf\"><\u002Fscript>\n<style>\n:root{--forge-ember:#ffb535;--ember-600:#E09A22;--ember-500:#ffb535;--ember-400:#FFC766;--ember-300:#FFD899;--ember-tint-12:rgba(255,181,53,0.12);--ember-tint-24:rgba(255,181,53,0.24);--text-on-accent:#0B0D10}\nbody{margin:0;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);-webkit-font-smoothing:antialiased}\na{color:var(--text-link);text-decoration:none}\na:hover{color:var(--text-link-hover)}\n@keyframes forgePulse{0%{opacity:0.28;transform:scale(0.96)}65%{opacity:0;transform:scale(1.04)}100%{opacity:0;transform:scale(1.04)}}\n@keyframes forgeRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--surface-page)\">\n  <header style=\"position:sticky;top:0;z-index:40;height:var(--header-height);display:flex;align-items:center;background:var(--surface-overlay);backdrop-filter:var(--blur-header);-webkit-backdrop-filter:var(--blur-header);border-bottom:1px solid var(--border-subtle)\">\n    <div style=\"width:100%;max-width:var(--container-wide);margin:0 auto;padding:0 var(--space-8);display:flex;align-items:center;gap:var(--space-10)\">\n      <a href=\"#\" style=\"display:flex;text-decoration:none\">\n        <x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.Wordmark\" short=\"{{ true }}\" size=\"{{ 20 }}\" hint-size=\"120px,20px\"><\u002Fx-import>\n      <\u002Fa>\n      <nav style=\"display:flex;align-items:center;gap:var(--space-8);margin-right:auto\">\n        <sc-for list=\"{{ navLinks }}\" as=\"link\" hint-placeholder-count=\"4\">\n          <a href=\"{{ link.href }}\" style=\"font-family:var(--font-body);font-size:var(--size-small);font-weight:var(--weight-medium);text-decoration:none;color:var(--text-muted);transition:var(--transition-hover)\" style-hover=\"color:var(--text-body)\">{{ link.label }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fnav>\n      <div style=\"display:flex;align-items:center;gap:var(--space-3)\">\n        \n        <x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.Button\" variant=\"primary\" size=\"sm\" href=\"{{ partnerUrl }}\" target=\"_blank\" rel=\"noopener\" hint-size=\"auto,36px\">Become A Design Partner<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"padding:120px 24px 140px;background:radial-gradient(80% 60% at 50% 0%, rgba(255,181,53,0.07), transparent 70%)\">\n    <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.05fr 0.95fr;gap:64px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:22px\">\n        <x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.Eyebrow\" tone=\"accent\" hint-size=\"auto,16px\">Built for Builders<\u002Fx-import>\n        <h1 style=\"margin:0;font:var(--weight-bold) 48px/1.12 var(--font-display);letter-spacing:-0.025em;color:var(--text-strong);text-wrap:balance\">The&nbsp;<span style=\"color: rgb(255, 181, 53); letter-spacing: -0.025em; text-wrap-mode: initial; background-color: initial;\">Living Spec<\u002Fspan><span style=\"color: var(--text-strong); letter-spacing: -0.025em; text-wrap-mode: initial; background-color: initial;\">&nbsp;that is&nbsp;<\u002Fspan><span data-om-id=\"f3ca0ba0:23\" style=\"font-family: ; font-size: ; font-style: ; font-variant-ligatures: ; font-variant-caps: ; font-weight: ; letter-spacing: -0.025em; text-wrap-mode: initial; background-color: initial; color: var(--ember-500);\">enforced<\u002Fspan><span style=\"color: var(--text-strong); letter-spacing: -0.025em; text-wrap-mode: initial; background-color: initial;\"> all the way to production<\u002Fspan><br><\u002Fh1>\n        <p style=\"margin:0;max-width:560px;font:var(--type-body-font);color:var(--text-muted);text-wrap:pretty\">Forge provides a spec-driven software factory that produces Application Context which is enforced in all SDLC stage via context enriched Work Orders that humans and Agents develop against.&nbsp;<\u002Fp>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:6px\">\n          <x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.Button\" size=\"lg\" href=\"{{ partnerUrl }}\" target=\"_blank\" rel=\"noopener\" icon=\"→\" icon-position=\"right\" hint-size=\"auto,52px\">Become A Design Partner<\u002Fx-import>\n          \n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border-default);border-radius:16px;background:var(--surface-card);padding:20px 22px;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(244,245,246,0.06)\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--border-subtle)\">\n          <span style=\"width: 8px; height: 8px; border-radius: 50%; background: var(--status-pass); display: block;\"><\u002Fspan>\n          <span style=\"font: 500 11px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint);\">100% SYNCED<\u002Fspan>\n          <span style=\"margin-left: auto; font: 500 11px/1 var(--font-mono); letter-spacing: 0.1em; color: var(--text-faint);\">feature-release-v2 · PRD v14<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-mouse-enter=\"{{ pauseSpec }}\" sc-camel-on-mouse-leave=\"{{ resumeSpec }}\" style=\"position:relative;width:100%;max-width:480px;height:404px;margin:6px auto 0\">\n          <svg sc-camel-view-box=\"0 0 480 404\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible\">\n            <line x1=\"240\" y1=\"74\" x2=\"240\" y2=\"126\" stroke=\"{{ wireProduct }}\" stroke-width=\"1.5\" stroke-dasharray=\"2 6\" stroke-linecap=\"round\"><\u002Fline>\n            <line x1=\"46\" y1=\"300\" x2=\"106\" y2=\"290\" stroke=\"{{ wireDesign }}\" stroke-width=\"1.5\" stroke-dasharray=\"2 6\" stroke-linecap=\"round\"><\u002Fline>\n            <line x1=\"434\" y1=\"300\" x2=\"374\" y2=\"290\" stroke=\"{{ wireEng }}\" stroke-width=\"1.5\" stroke-dasharray=\"2 6\" stroke-linecap=\"round\"><\u002Fline>\n          <\u002Fsvg>\n\n          <sc-for list=\"{{ actors }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div style=\"position:absolute;left:{{ a.left }};top:{{ a.top }};width:72px;display:flex;flex-direction:column;align-items:center;gap:7px\">\n              <span style=\"width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid {{ a.border }};background:{{ a.bg }};box-shadow:{{ a.glow }};color:{{ a.fg }};transition:all 260ms cubic-bezier(0.22,1,0.36,1)\"><x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.Icon\" name=\"{{ a.icon }}\" size=\"24\" hint-size=\"24px,24px\"><\u002Fx-import><\u002Fspan>\n              <span style=\"font:500 11px/1 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:{{ a.labelColor }};transition:color 260ms cubic-bezier(0.22,1,0.36,1)\">{{ a.name }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"position:absolute;left:22%;top:31.5%;width:56%;min-width:212px;padding:14px 14px 16px;border-radius:14px;border:1px solid {{ specBorder }};background:var(--surface-inset);box-shadow:{{ specGlow }};transition:border-color 400ms cubic-bezier(0.22,1,0.36,1),box-shadow 400ms cubic-bezier(0.22,1,0.36,1)\">\n            <div style=\"position:absolute;inset:-6px;border-radius:20px;background:{{ specHue }};opacity:0.3;animation:forgePulse 2200ms cubic-bezier(0.22,1,0.36,1) infinite;pointer-events:none\"><\u002Fdiv>\n            <div style=\"position:relative;display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font:600 10px/1 var(--font-mono);letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint)\">Living Spec<\u002Fspan>\n              <sc-for list=\"{{ specStages }}\" as=\"ss\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;border:1px solid {{ ss.border }};background:{{ ss.bg }};transition:all 300ms cubic-bezier(0.22,1,0.36,1)\">\n                  <span style=\"width:7px;height:7px;border-radius:50%;background:{{ ss.hue }};flex-shrink:0;box-shadow:{{ ss.dotGlow }};transition:box-shadow 300ms\"><\u002Fspan>\n                  <span style=\"font:var(--weight-semibold) 12.5px/1.2 var(--font-display);color:{{ ss.fg }};transition:color 300ms\">{{ ss.key }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font:500 9.5px/1 var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;color:{{ ss.metaColor }};transition:color 300ms\">{{ ss.meta }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-subtle)\">\n          <span style=\"font:500 11px/1 var(--font-mono);letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint)\">ONE SOURCE OF TRUTH ACROSS MULTIPLE TEAMS<\u002Fspan>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:110px 24px\">\n    <div style=\"max-width:1200px;margin:0 auto\">\n      <x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.SectionHeading\" eyebrow=\"The role of product is changing\" eyebrow-tone=\"accent\" title=\"Shift to Full Stack Builders\" lede=\"Three handoffs used to be three jobs. Generative and agentic AI collapsed them into one person who frames the problem, designs it, generates the code, and owns what ships.\" hint-size=\"100%,180px\"><\u002Fx-import>\n\n      <div style=\"margin-top:56px;display:grid;grid-template-columns:1fr 190px 1fr;gap:0;align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"border:1px solid var(--border-subtle);border-radius:12px;background:var(--surface-card);padding:20px 22px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font:var(--weight-semibold) 17px/1.25 var(--font-display);color:var(--text-strong)\">Product Management<\u002Fspan>\n            <span style=\"font:400 14px/1.5 var(--font-body);color:var(--text-faint)\">Wrote the PRD, handed it off<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border-subtle);border-radius:12px;background:var(--surface-card);padding:20px 22px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font:var(--weight-semibold) 17px/1.25 var(--font-display);color:var(--text-strong)\">Product Design<\u002Fspan>\n            <span style=\"font:400 14px/1.5 var(--font-body);color:var(--text-faint)\">Drew the UI/UX flows for someone else to build<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border-subtle);border-radius:12px;background:var(--surface-card);padding:20px 22px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font:var(--weight-semibold) 17px/1.25 var(--font-display);color:var(--text-strong)\">Engineering<\u002Fspan>\n            <span style=\"font:400 14px/1.5 var(--font-body);color:var(--text-faint)\">Frontend and backend development, split by team<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 18px;align-self:stretch;justify-content:center;position:relative\">\n          <span style=\"font:500 10.5px/1.5 var(--font-mono);letter-spacing:0.12em;text-transform:uppercase;color:var(--ember-500);text-align:center\">Generative<br>and agentic AI<\u002Fspan>\n          <div style=\"display:flex;align-items:center;width:100%\">\n            <span style=\"flex:1;height:1px;background:var(--ember-tint-24)\"><\u002Fspan>\n            <span style=\"width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid var(--ember-500)\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid var(--ember-tint-24);border-radius:16px;background:rgba(255,181,53,0.05);padding:28px;display:flex;flex-direction:column;gap:16px\">\n          <span style=\"font:600 10.5px/1 var(--font-mono);letter-spacing:0.16em;text-transform:uppercase;color:var(--ember-500)\">The default role<\u002Fspan>\n          <h3 style=\"margin:0;font:var(--weight-bold) 30px/1.15 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">Full Stack Builder<\u002Fh3>\n          <p style=\"margin:0;font:400 16px/1.55 var(--font-body);color:var(--text-muted);text-wrap:pretty\">One person now frames the problem, designs it, generates the code, and owns what ships.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:4px\">\n letter-spacing:-0.03em;color:var(--text-strong)\">Ship what you actually wrote<\u002Fh2>\n      <p style=\"margin:0;font:var(--type-body-font);color:var(--text-muted)\">Start free with one project. Bring the requirements you already wrote and keep control of them through every stage that follows.<\u002Fp>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;justify-content:center\">\n        <x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.Button\" size=\"lg\" href=\"{{ partnerUrl }}\" target=\"_blank\" rel=\"noopener\" icon=\"→\" icon-position=\"right\" hint-size=\"auto,52px\">Become Design Partner<\u002Fx-import>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <x-import component-from-global-scope=\"SoftwareForgeDesignSystem_c81bbf.SiteFooter\" tagline=\"Governed from spec to production.\" columns=\"{{ footerColumns }}\" copyright=\"© 2026 Opsera. All rights reserved.\" hint-size=\"100%,380px\"><\u002Fx-import>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://auth.softwareforge.ai/a/auth/login&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CTAs&quot;},&quot;partnerUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://claude.ai/design/p/5c7eac4e-77bc-4131-ba2e-88a8ec54d030?file=Forge+Design+Partner.dc.html&amp;via=share&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CTAs&quot;}}\">\nclass Component extends DCLogic {\n  state = { painPaused: false, painRot: 0, painOff: {}, stage: 0, carouselIdx: 0, carouselPaused: false, modelChoice: {}, quoteIdx: 0, quotePaused: false, appCtxIdx: 0, appCtxPaused: false, specIdx: 0, specPaused: false, storyIdx: 0, storyPaused: false };\n\n  componentDidMount() {\n    this._storyTimer = setInterval(() => {\n      if (this.state.storyPaused) return;\n      this.setState(s => ({ storyIdx: (s.storyIdx + 1) % 2 }));\n    }, 7000);\n    this._specTimer = setInterval(() => {\n      if (this.state.specPaused) return;\n      this.setState(s => ({ specIdx: (s.specIdx + 1) % 3 }));\n    }, 2200);\n    this._quoteTimer = setInterval(() => {\n      if (this.state.quotePaused) return;\n      this.setState(s => ({ quoteIdx: (s.quoteIdx + 1) % 6 }));\n    }, 4000);\n    this._painTimer = setInterval(() => {\n      if (this.state.painPaused) return;\n      this.setState(s => ({ painRot: s.painRot + 1 }));\n    }, 5000);\n    this._appCtxTimer = setInterval(() => {\n      if (this.state.appCtxPaused) return;\n      this.setState(s => ({ stage: (s.stage + 1) % 3, appCtxIdx: 0 }));\n    }, 5000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._painTimer);\n    clearInterval(this._storyTimer);\n    clearInterval(this._specTimer);\n    clearInterval(this._quoteTimer);\n    clearInterval(this._appCtxTimer);\n    clearTimeout(this._appCtxResume);\n  }\n\n  renderVals() {\n    const SPEC_HUES = ['#ffb535', '#3D7EFF', '#3FCF8E'];\n    const SPEC_RGB = ['255,181,53', '61,126,255', '63,207,142'];\n    const SPEC_DEFS = [\n      { key: 'Intent', meta: 'signed', actors: ['Product', 'Design'] },\n      { key: 'Application Context', meta: 'v14', actors: ['Design', 'Engineering'] },\n      { key: 'Work Orders', meta: '18 open', actors: ['Engineering', 'Product'] }\n    ];\n    const ACTOR_DEFS = [\n      { name: 'Product', icon: 'clipboard-list', left: 'calc(50% - 36px)', top: '2%' },\n      { name: 'Design', icon: 'pen-tool', left: '2%', top: '75%' },\n      { name: 'Engineering', icon: 'terminal', left: 'calc(98% - 72px)', top: '75%' }\n    ];\n    const si = this.state.specIdx % 3, sHue = SPEC_HUES[si], sRgb = SPEC_RGB[si];\n    const liveActors = SPEC_DEFS[si].actors;\n    const specStages = SPEC_DEFS.map((s, i) => {\n      const on = i === si;\n      return {\n        key: s.key, meta: s.meta, hue: SPEC_HUES[i],\n        border: on ? SPEC_HUES[i] : 'var(--border-subtle)',\n        bg: on ? 'rgba(' + SPEC_RGB[i] + ',0.10)' : 'transparent',\n        fg: on ? 'var(--text-strong)' : 'var(--text-muted)',\n        metaColor: on ? SPEC_HUES[i] : 'var(--text-faint)',\n        dotGlow: on ? '0 0 0 4px rgba(' + SPEC_RGB[i] + ',0.20)' : 'none'\n      };\n    });\n    const actors = ACTOR_DEFS.map(a => {\n      const on = liveActors.indexOf(a.name) > -1;\n      return {\n        name: a.name, icon: a.icon, left: a.left, top: a.top,\n        border: on ? sHue : 'var(--border-subtle)',\n        bg: on ? 'rgba(' + sRgb + ',0.12)' : 'var(--surface-inset)',\n        glow: on ? '0 0 0 5px rgba(' + sRgb + ',0.14)' : 'none',\n        fg: on ? sHue : 'var(--text-muted)',\n        labelColor: on ? 'var(--text-body)' : 'var(--text-faint)'\n      };\n    });\n    const wire = (name) => liveActors.indexOf(name) > -1 ? sHue : 'rgba(244,245,246,0.16)';\n    const EMBER = 'var(--ember-500)', PASS = 'var(--status-pass)', BLUE = 'var(--blue-500)';\n    const dim = 'var(--neutral-500)', body = 'var(--text-body)', muted = 'var(--text-muted)';\n\n    const stages = [\n      { key: 'Intent', badge: '01 / 5', file: 'intent.forge',\n        title: 'Intent starts where the signal does',\n        body: 'A user interview, a run of support tickets, a customer call, a note from Sales, a shift in the market. Forge takes those scattered signals and frames them into one stated outcome, with its constraints and its approver attached, carried into every step after it.',\n        points: ['Interviews, tickets, calls, Sales notes, and market shifts land in one place', 'Framed as an outcome with constraints and an approver, not a loose request', 'Every requirement downstream traces back to the signal that prompted it'],\n        cta: 'Generate the PRD',\n        lines: [ {n:'1',t:'mission: checkout-v2',c:body}, {n:'2',t:'outcome: one-tap reorder for returning buyers',c:muted}, {n:'3',t:'constraints: [PCI-DSS, SOX, no PII in logs]',c:EMBER}, {n:'4',t:'systems: paymen triOn = (idx) => ({\n      border: idx === i ? EMBER : 'var(--border-subtle)',\n      bg: idx === i ? 'var(--ember-tint-24)' : 'var(--surface-card)',\n      color: idx === i ? 'var(--ember-500)' : 'var(--text-muted)'\n    });\n    const tri = [triOn(0), triOn(1), triOn(2)];\n\n    const stageRows = stages.map((s, idx) => ({\n      key: s.key, n: '0' + (idx + 1),\n      select: () => setStage(idx),\n      bg: idx === i ? 'var(--surface-card)' : 'transparent',\n      edge: idx === i ? EMBER : 'transparent',\n      fg: idx === i ? 'var(--text-strong)' : 'var(--text-muted)'\n    }));\n\n    const pains = [\n      { n: '01', icon: 'git-branch', title: 'Spec drift', body: 'What gets built looks nothing like what was approved. Builders lose credibility, and every drift cycle costs another round of rework.',\n        quotes: [\n          { logo: 'tiktok', org: 'TikTok Shop', author: 'Yating Zhuang, Product Manager, TikTok Shop', title: 'The handoff gap', text: '“That happens a lot. For the initial PRD or prototype there’s a gap in details I didn’t think about, so when I hand it to the dev team they come back asking which option I actually want.”' },\n          { logo: 'dolby', org: 'Dolby', author: 'Shawn Yao, Product Manager, UGC', title: 'Intent misalignment', text: '“Next week on the alignment meeting, this thing that I thought would look a certain way looks a little bit different.”' },\n          { logo: 'shieldai', org: 'Shield AI', author: 'Jonathan Goodlow, Staff Technical Product Manager, Shield AI', title: 'Rules broken under deadline', text: '“The specific person on this specific team decided, you know, I’m gonna push this into the build anyway, even though it’s after the specific date and it breaks these rules, and they did it, and what happens? It broke.”' },\n          { logo: 'tiktok', org: 'TikTok', author: 'Angel Jin, Product Manager, Ads and Voice & Music Intelligence, TikTok', title: 'The PRD kept moving', text: '“There have been times when by the time it’s shipped, the PRD has changed so much as we continue to renegotiate the requirements that it’s quite far from what the original idea was.”' }\n        ] },\n      { n: '02', icon: 'eye-off', title: 'Visibility gap', body: '\\u201cI lose the thread the second I hand it off.\\u201d No insight into what an agent actually built or decided until launch.',\n        quotes: [\n          { logo: 'dolby', org: 'Dolby', author: 'Shawn Yao, Product Manager, UGC', title: 'Manual syncs', text: '\\u201cI don\\u2019t often feel the need to go in and keep adjusting the PRD... you can just reference that in an email or a team\\u2019s chat.\\u201d' },\n          { logo: 'shieldai', org: 'Shield AI', author: 'Jonathan Goodlow, Staff Technical Product Manager, Shield AI', title: 'Finding out when it is already on fire', text: '“By the time I got into the office there was already some panic setting in. So you know, there’s, it just immediately spread to me of like, okay, what happened? Identify the issue. What’s the process I’m gonna go down?”' },\n          { logo: 'tiktok', org: 'TikTok', author: 'Angel Jin, Product Manager, Ads and Voice & Music Intelligence, TikTok', title: 'A black box after handoff', text: '“At TikTok my visibility into it is very low. It kind of does feel like a black box where someone might quote you 20 days after you’ve handed off a PRD and then every day you’re just asking if we’re still on track. And at the end of the 20 days, you’re like, we’re not on track. And then I ask why.”'}\n        ] },\n      { n: '03', icon: 'refresh-cw', title: 'High rework rate', body: 'Without a plan, AI tools average 3\\u20134 retries to get a task right, guessing at requirements and re-learning the system each time.',\n        quotes: [\n          { logo: 'tiktok', org: 'TikTok Shop', author: 'Yating Zhuang, Product Manager, TikTok Shop', title: 'The prompt tuning grind', text: '\\u201cSometimes it\\u2019s hard to fine tune a prompt to get the prototype close to what\\u2019s u2014 we need an AI driven SDLC that accelerates time to market, delivers measurable business outcomes, and allows our talent to focus on strategic, high value work. What once took weeks can now be achieved in minutes with an enterprise grade modernization blueprint.', name: 'Venkat Gopalan', title: 'Chief Digital, Technology & Data Officer (CDTO), Belcorp' },\n      { quote: 'Modern, intelligent application delivery requires a platform that provides architectural consistency across environments for both modernizing legacy systems and launching new builds. Forge enables enterprises to address legacy tech debt while helping to improve the speed and quality of cloud-native application delivery.', name: 'Matthew Flug', title: 'Research Manager, Intelligent Application Modernization, IDC' },\n      { quote: 'AI has given every developer superpowers, but code generation without enterprise-grade governance limits the use of such power. Forge is the first Enterprise Software Factory that makes AI-generated code secure, compliant, and auditable by design.', name: 'Rajeev Madhavan', title: 'Founder and Managing Director, Radiant' },\n      { quote: 'AI can generate code in minutes, but turning it into real enterprise outcomes still takes weeks. Forge promises to be the AI software factory that addresses the needs of the Outcome Era, closing the gap by anchoring every artifact to intent and keeping governance inline.', name: 'Srikrishnan Ganesan', title: 'CEO, RocketLane' }\n    ];\n\n    const faqs = [\n      { q: 'Isn\\u2019t this just Copilot with extra steps?', a: 'No. Copilot and similar assistants don\\u2019t carry your org\\u2019s compliance policy, architecture, or prior decisions between sessions, so every session restarts from zero context. The real differentiation is the persistent, policy-aware Living Spec plus Work Order layer sitting underneath the agent, not the agent itself. That\\u2019s the layer that took one benchmark from 3.2 tries per task down to 1.3. Copilot makes one person faster at writing code; Forge makes an entire team\\u2019s output provable, auditable, and consistent with what was actually approved, regardless of which coding tool generated it.' },\n      { q: 'How is Forge different from GitHub Copilot, Cursor, or Devin?', a: 'Those help one person write code faster, one prompt at a time, with no memory once the session ends. Forge covers the whole path from your requirements to a deployed build, remembers your decisions between sessions, and keeps your original intent the enforced standard the whole way to production, not just at kickoff.' },\n      { q: 'We already use an autonomous agent like Devin. What changes?', a: 'An autonomous agent takes a whole task and runs it end to end without you steering every step, which is genuinely useful. The catch is that the reasoning stays inside that run: come back later and you are reconstructing why it built things that way, and auditors have nothing to read. Forge gives the agent a governed Work Order to work from and keeps the plan and the trail after the session closes, so what it built is still explainable next quarter.' },\n      { q: 'We use a spec-driven tool like Kiro. Isn\\u2019t that the same idea?', a: 'Close, and it is the right instinct: you get requirements, a design doc, and a task list before anyone writes code. But that plan is a file in one developer\\u2019s IDE. It is not shared with Product or Design, and nothing ties it to the policies you have to prove you followed. Forge turns that plan into a versioned Application Context and Work Orders any agent or teammate can pick up, with your intent and compliance context already attached.' },\n      { q: 'Could we just build this governance layer ourselves?', a: 'You can, and you would get exactly the workflow you want with no vendor in the middle. The cost is that a policy engine, an audit trail, and a spec pipeline are years of your team\\u2019s roadmap before a single customer feature ships on top of them. Teams choose Forge when they need governance in place this quarter and would rather spend that roadmap on their own product.' },\n      { q: 'How does Forge manage context, and how is that different from a spec?', a: 'They work together but they are not the same thing. Context is the always-on memory layer: it folds architecture, security policy, and operational rules into one shared source of truth, so every AI agent has situational awareness instead of a chat history that resets each session. A spec is the per-task contract pulled from that context, covering intent, requirements, architecture, and compliance mapping, and it acts as the gate code has to clear before it merges.' },\n      { q: 'How do context and spec show up inside a Work Order?', a: 'A Work Order is the record behind one change: what it is allowed to touch, which requirement it satisfies, which rules apply, and who approved it. It is where context and spec get packaged into something an agent can act on. Instead of a vague prompt against an unknown repo, the agent gets a bounded task with explicit in and out of scope, roughly eight acceptance criteria, the relevant RTM rows, and your coding standards already injected. Context feeds the Work Order automatically, and governance rides along inside the spec, so it is gated at commit instead of caught in review later.' },\n      { q: 'Which model does Forge run on?', a: 'Whichever one your company already approved, Claude, GPT, and Gemini among them. Forge writes the prompts and sends them to your provider, so you are not locked in and security has nothing new to review.' },\n      { q: 'How does this hold up in a regulated environment?', a: 'Work Orders map directly onto SOC 2, HIPAA, and SOX-style control checklists, and compliance is enforced from Day 0 as the build happens rather than reviewed after the fact. You hand compliance teams evidence in the format they already expect, instead of translating a build log after the fact.' },\n
